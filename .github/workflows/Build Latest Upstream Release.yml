name: Build Latest Upstream Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to fetch and build from FossifyOrg/Messages"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Latest and Publish Release
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the latest code from the upstream repository
      - name: Checkout Latest Code from Upstream
        uses: actions/checkout@v4
        with:
          repository: 'FossifyOrg/Messages'
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 1

      # Step 2: Extract the latest commit SHA and metadata for dynamic tagging
      - name: Resolve Commit Info and Set Tag
        id: git_info
        run: |
          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          
          echo "FULL_SHA=$FULL_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
          echo "TAG_NAME=v-$SHORT_SHA" >> $GITHUB_ENV

      # Step 3: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 4: Set up Gradle environment with caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 5: Grant execution permission to gradlew
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Step 6: Build APKs (managing memory to avoid runner OOM crashes)
      - name: Build APKs with Gradle
        run: |
          ./gradlew assembleFossDebug assembleFossRelease --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      # Step 7: Gather generated APK files into an export folder
      - name: Prepare Artifacts for Release
        run: |
          mkdir -p dist_apks
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} dist_apks/ \;

      # Step 8: Force create a GitHub Release using the dynamic tag and attach APKs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Fossify Messages Latest (${{ env.SHORT_SHA }})"
          body: |
            ## Automated Upstream Build
            - **Upstream Repository:** [FossifyOrg/Messages](https://github.com/FossifyOrg/Messages)
            - **Branch:** `${{ github.event.inputs.branch || 'main' }}`
            - **Commit SHA:** `${{ env.FULL_SHA }}`
            - **Commit Summary:** ${{ env.COMMIT_MSG }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
