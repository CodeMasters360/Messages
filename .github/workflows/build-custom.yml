name: Build APK and publish to latest release

on:
  push:
  workflow_dispatch:

# needed to create releases / upload release assets with the built-in token
permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same signing key on every build, so a new APK can be installed over the previous one.
      # (This is the public Android debug-style key, not a secret.)
      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFossDebug --stacktrace

      - name: Rename APK
        run: |
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          echo "Built: $APK"
          cp "$APK" FossifyMessages-Filters.apk

      - name: Keep APK as workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: FossifyMessages-Filters-apk
          path: FossifyMessages-Filters.apk
          if-no-files-found: error

      # Attach the APK to the newest release of this repo.
      # If the repo has no release (and maybe no tag) yet, a new release + tag is created first.
      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$TAG" ]; then
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
            echo "No release found - creating $TAG"
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Automated build of commit $GITHUB_SHA" \
              --latest
          fi
          echo "Uploading FossifyMessages-Filters.apk to release $TAG"
          gh release upload "$TAG" FossifyMessages-Filters.apk --clobber
